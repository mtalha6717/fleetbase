# Production on Dokploy. MySQL 8.0 runs in this stack (host port 3307, localhost only;
# the host's MariaDB keeps 3306). Redis runs on the EC2 host.
#
# Environment: paste .env.prod into Dokploy's Environment tab (Dokploy writes it to .env).
# Domains (HTTPS on, strip path off):
#   fleetbase-api.cybroscloud.com      /               -> application:8000
#   fleetbase-api.cybroscloud.com      /socketcluster  -> socket:8000
#   fleetbase-console.cybroscloud.com  /               -> console:4200
# After the first deploy and every upgrade, run ./deploy.sh in the application container.

x-api: &api
  image: fleetbase/fleetbase-api:${FLEETBASE_VERSION:-v0.7.72}
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    database:
      condition: service_healthy
  env_file: .env
  volumes:
    # Named volume: Dokploy re-clones the repo dir on each deploy, a bind mount there would lose uploads.
    - storage:/fleetbase/api/storage/app
  environment:
    ENVIRONMENT: production
    APP_DEBUG: "false"
    APP_NAME: Fleetbase
    APP_URL: https://fleetbase-api.cybroscloud.com
    CONSOLE_HOST: https://fleetbase-console.cybroscloud.com
    SESSION_DOMAIN: fleetbase-api.cybroscloud.com
    DATABASE_URL: mysql://root:${DB_PASSWORD:?set DB_PASSWORD}@database:3306/fleetbase
    QUEUE_CONNECTION: redis
    CACHE_DRIVER: redis
    CACHE_PATH: /fleetbase/api/storage/framework/cache
    BROADCAST_DRIVER: socketcluster
    LOG_CHANNEL: daily
    REGISTRY_HOST: https://registry.fleetbase.io
    REGISTRY_PREINSTALLED_EXTENSIONS: "true"
    OSRM_HOST: https://router.project-osrm.org
    SOCKETCLUSTER_PUBLISH_URL: http://socket:8001
    SOCKETCLUSTER_ORIGIN: https://fleetbase-console.cybroscloud.com

services:
  # Fleetbase is tested on MySQL 8.0; its migrations break on MariaDB.
  database:
    image: mysql:8.0-oracle
    restart: unless-stopped
    # Binlog off, as in docker-compose.yml: telematics ingest grows it to hundreds of GB.
    command: ["mysqld", "--skip-log-bin"]
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_DATABASE: fleetbase
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  application:
    <<: *api

  queue:
    <<: *api
    command: ["php", "artisan", "queue:work"]

  scheduler:
    <<: *api
    command: ["go-crond", "--verbose", "root:./crontab"]

  socket:
    image: fleetbase/fleetbase-socket:${FLEETBASE_VERSION:-v0.7.72}
    restart: unless-stopped
    environment:
      SOCKETCLUSTER_OPTIONS: '{"origins":"https://fleetbase-console.cybroscloud.com:*,wss://fleetbase-console.cybroscloud.com:*"}'
      SOCKETCLUSTER_AUTH_ENABLED: ${SOCKETCLUSTER_AUTH_ENABLED:-false}
      SOCKETCLUSTER_AUTH_KEY: ${SOCKETCLUSTER_AUTH_KEY:-}
      SOCKETCLUSTER_AUTH_MODE: ${SOCKETCLUSTER_AUTH_MODE:-}
      SOCKETCLUSTER_AUTHORIZE_URL: http://application:8000/int/v1/socket/authorize

  console:
    image: fleetbase/fleetbase-console:${FLEETBASE_VERSION:-v0.7.72}
    restart: unless-stopped
    volumes:
      - ./console/fleetbase.config.prod.json:/usr/share/nginx/html/fleetbase.config.json:ro

volumes:
  mysql:
  storage:
